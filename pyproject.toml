[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-solver-bench"
dynamic = ["version"]
description = "Reproducible validation-based comparisons of dynamical-system models and ODE solvers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Vaishnavi Raghupathi"}]
keywords = ["ode", "dynamical-systems", "benchmark", "scientific-machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3,<2"]
plots = ["matplotlib>=3.8,<4"]
custom = ["sympy>=1.12,<2"]
demo = ["streamlit>=1.40,<2", "pandas>=2,<4", "plotly>=5.20,<8", "sympy>=1.12,<2", "scikit-learn>=1.3,<2"]
research = ["scikit-learn>=1.3,<2", "matplotlib>=3.8,<4", "statsmodels>=0.14,<1", "sympy>=1.12,<2", "threadpoolctl>=3.5,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2", "twine>=6,<8", "pyyaml>=6,<7"]

[project.scripts]
adaptive-solver = "adaptive_ode.cli:main"

[project.urls]
Repository = "https://github.com/Vaishnavi-Raghupathi/Adaptive-ODE-Solver-with-Diagnostic-Driven-Model-Switching"
Issues = "https://github.com/Vaishnavi-Raghupathi/Adaptive-ODE-Solver-with-Diagnostic-Driven-Model-Switching/issues"

[tool.setuptools.dynamic]
version = {attr = "adaptive_ode.__version__"}

[tool.setuptools.packages.find]
include = ["adaptive_ode*"]

[tool.coverage.run]
source = ["adaptive_ode"]
omit = ["adaptive_ode/solvers/neural_ode.py", "adaptive_ode/experiments/*", "adaptive_ode/pipeline/*", "adaptive_ode/diagnostics/*", "adaptive_ode/evaluation/plotting.py"]

[tool.coverage.report]
show_missing = true
